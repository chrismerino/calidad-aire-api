name: calidad-aire
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: calidad_aire
      MYSQL_USER: aire_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/01_tablas.sql:/docker-entrypoint-initdb.d/01_tablas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D calidad_aire -e "SELECT 1" > /dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  mysql-data:
